# ########################################
# Emotion recognition on KITE speech segments using wav2vec2.
# Five classes: anger, happiness, neutral, sadness, surprise.
# ########################################

# Seed needs to be set at top of yaml, before objects with parameters are made
seed: 1993
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

data_folder: /media/computergeek/SER-datasets/korean-audio-sentiment-analysis/data/KITE
metadata_csv: !ref <data_folder>/1_metadata_ser.csv
emotions: [anger, happiness, neutral, sadness, surprise]

output_folder: !ref results/kite_xlsr/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

# Multilingual wav2vec2 pretrained on 128 languages, including Korean.
# The English base model stayed near the neutral baseline on KITE.
wav2vec2_hub: facebook/wav2vec2-xls-r-300m
wav2vec2_folder: !ref <save_folder>/wav2vec2_checkpoint

# Path where data manifest files will be stored
train_annotation: !ref <output_folder>/train.json
valid_annotation: !ref <output_folder>/valid.json
test_annotation: !ref <output_folder>/test.json
skip_prep: False

# Experiment switches. Defaults reproduce the finished XLS-R run.
# inverse: total / (n_classes * count). inverse_sqrt: square root of that.
class_weighting: inverse
# Train-time speed, gain, and a short mute on anger, sadness, and surprise.
augment_rare: False
augment_prob: 0.8
balanced_sampling: False
# Mix the two pooled vectors in a training batch. Half the batches include
# anger, sadness, or surprise. The class-weighted loss on the real clips stays.
latent_mixup: False
latent_mixup_rare_prob: 0.5
freeze_transformer_layers: 0
# Voice-only copies of the training clips. Empty keeps the original drama wavs.
# Validation and test always stay on data_folder.
train_wav_folder: ""
classifier_hidden: 0
label_mode: flat
neutral_name: neutral
select_metric: macro_f1
logit_adjust: False
save_predictions: False
logit_taus: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0]

# The train logger writes training statistics to a file, as well as stdout.
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

ckpt_interval_minutes: 15 # save checkpoint every N min

####################### Training Parameters ####################################
number_of_epochs: 30
# XLS-R 300M does not fit a batch of 4 on an 8 GB GPU.
batch_size: 2
lr: 0.0001
lr_wav2vec2: 0.00001

# freeze all wav2vec2
freeze_wav2vec2: False
# set to true to freeze the CONV part of the wav2vec2 model
freeze_wav2vec2_conv: True

####################### Model Parameters #######################################
sample_rate: 16000
# Crop longer turns so a batch fits in 8 GB. Training uses a random crop;
# validation and test use the center.
max_wav_seconds: 16
encoder_dim: 1024

# Number of emotions (anger, happiness, neutral, sadness, surprise)
out_n_neurons: 5

dataloader_options:
    batch_size: !ref <batch_size>
    shuffle: True
    num_workers: 2  # 2 on linux but 0 works on windows
    drop_last: False

# Wav2vec2 encoder
wav2vec2: !new:speechbrain.integrations.huggingface.wav2vec2.Wav2Vec2
    source: !ref <wav2vec2_hub>
    output_norm: True
    freeze: !ref <freeze_wav2vec2>
    freeze_feature_extractor: !ref <freeze_wav2vec2_conv>
    save_path: !ref <wav2vec2_folder>

avg_pool: !new:speechbrain.nnet.pooling.StatisticsPooling
    return_std: False

output_mlp: !new:speechbrain.nnet.linear.Linear
    input_size: !ref <encoder_dim>
    n_neurons: !ref <out_n_neurons>
    bias: False

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

modules:
    wav2vec2: !ref <wav2vec2>
    output_mlp: !ref <output_mlp>

model: !new:torch.nn.ModuleList
    - [!ref <output_mlp>]

log_softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

compute_cost: !name:speechbrain.nnet.losses.nll_loss

error_stats: !name:speechbrain.utils.metric_stats.MetricStats
    metric: !name:speechbrain.nnet.losses.classification_error
        reduction: batch

opt_class: !name:torch.optim.Adam
    lr: !ref <lr>

wav2vec2_opt_class: !name:torch.optim.Adam
    lr: !ref <lr_wav2vec2>

lr_annealing: !new:speechbrain.nnet.schedulers.NewBobScheduler
    initial_value: !ref <lr>
    improvement_threshold: 0.0025
    annealing_factor: 0.9
    patient: 0

lr_annealing_wav2vec2: !new:speechbrain.nnet.schedulers.NewBobScheduler
    initial_value: !ref <lr_wav2vec2>
    improvement_threshold: 0.0025
    annealing_factor: 0.9

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        model: !ref <model>
        wav2vec2: !ref <wav2vec2>
        lr_annealing_output: !ref <lr_annealing>
        lr_annealing_wav2vec2: !ref <lr_annealing_wav2vec2>
        counter: !ref <epoch_counter>
